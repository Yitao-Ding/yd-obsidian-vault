# YD の研究興味プロファイル (ai-researcher が参照)
# キーワードに重みを付けて、relevance スコア (0-10) を計算する。
# Edit するとフィルタ閾値ぎりぎりの記事の取捨が変わる。
#
# scoring (2026-06-14 改訂 — src/filter/relevance.py と対応):
#   - 同一バケット内の追加ヒットは逓減 (1本の長い abstract で 10.0 飽和を防ぐ)
#   - タイトル一致は abstract のみ一致より +0.5/バケット 加点
#   - curated ソース (hn / 公式ブログ) は topical シグナルが1つでもあれば +1.0 ベース
#     → タイトルだけの HN / ブログ記事を閾値 1.5 に乗せる (観測A の修正)
#   - firehose (arxiv / hf_papers / github_trending) はベースなし = 自力で稼ぐ
#   - project_signals に当たると 4.0 = 「YDのプロジェクトに刺さるか」を最優先軸に
#   1記事あたり最大 10.0 にクリップ。

