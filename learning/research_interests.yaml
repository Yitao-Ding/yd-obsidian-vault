# ソース重み付け (2026-06-14 再調整):
#   実際の「当たり率」は HN + Anthropic/OpenAI 公式ブログに集中。学術 (arxiv/hf) は
#   project_signals or 実キーワードに当たった高スコアのみ通したい → ベース低め。
source_boost:
  anthropic_blog: 2.5
  openai_blog: 2.0
  google_research: 1.0
  hn: 1.0                 # 0.5 → 1.0: HN の当たり率が最も高い (curated baseline と別途)
  hf_papers: 0.0         # 旧 papers_with_code。学術ノイズ抑制のためベース0 (自力で稼ぐ)
  arxiv: 0.0             # 学術は keyword/project ヒット必須
  github_trending: 0.0   # repo 名だけで通さない。話題語に当たった時のみ

# curated ソース: 上流で AI 関連フィルタ済み。topical シグナルが1つでもあれば
# +1.0 ベースを足して、タイトルだけの記事でも閾値1.5に乗せる。
# arxiv / hf_papers / github_trending は意図的に除外 (firehose)。
curated_sources:
  - hn
  - anthropic_blog
  - openai_blog
  - google_research
